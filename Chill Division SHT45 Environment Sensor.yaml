# Chill Division SHT45 Environment Sensor
# Temperature, humidity and VPD from a Sensirion SHT45 on a Grove port.
# https://github.com/Chill-Division/Chill-Division-ESPHome
#
# How to use it
#   1. In ESPHome Device Builder, click EDIT on your device.
#   2. Paste everything below the dashed line at the bottom of its YAML.
#      Your YAML can only have one "i2c:" section. If it already has one,
#      even one that's commented out with #, delete it first.
#   3. Check the pins (below), then click SAVE and INSTALL.
#
# CHECK THE PINS
#   sda and scl below are set for the M5Stack Unit PoE-P4. On its Grove
#   port the yellow wire is GPIO53 (sda) and the white wire is GPIO54 (scl).
#   On any other controller, look up its Grove pins in the table in this
#   repository's README and change both lines to match.
# ---------------------------------------------------------------------------

i2c:
  sda: GPIO53  # Unit PoE-P4, yellow wire. Check this for your controller.
  scl: GPIO54  # Unit PoE-P4, white wire. Check this for your controller.
  scan: true
  id: bus_1

sensor:
  - platform: sht4x
    address: 0x44
    update_interval: 10s
    temperature:
      name: "Temperature"
      id: sht45_temperature
      accuracy_decimals: 1
    humidity:
      name: "Humidity"
      id: sht45_humidity
      accuracy_decimals: 1

  # Vapour pressure deficit (VPD) of the air, in kPa, worked out on the
  # device from the temperature and humidity above.
  - platform: template
    name: "VPD"
    id: sht45_vpd
    icon: "mdi:gauge"
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 10s
    lambda: |-
      const float t = id(sht45_temperature).state;
      const float rh = id(sht45_humidity).state;
      if (isnan(t) || isnan(rh)) return NAN;
      return (1.0f - rh / 100.0f) * 0.6108f * expf(17.27f * t / (t + 237.3f));
